spring:
  application:
    name: springsecuritydemo

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/springsecuritydemo
    username: postgres
    password: postgres

  jpa:
    show-sql: true

  otel:
    propagation:
      propagators: tracecontext,baggage
    otlp:
      metrics:
        export:
          url: http://localhost:4318/v1/metrics
    opentelemetry:
      propagation:
        type: tracecontext,baggage
      tracing:
        export:
          otlp:
            endpoint: http://localhost:4318/v1/traces
      logging:
        export:
          otlp:
            endpoint: http://localhost:4318/v1/logs

logging:
  level:
    com.spring.security.springsecuritydemo: INFO

management:
  observations:
    enable:
      default: true
  endpoint:
    metrics:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95, 0.99
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s
